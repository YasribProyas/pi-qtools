name: Release

# Publishes to npm via OpenID Connect trusted publishing: no NPM_TOKEN anywhere.
# npm verifies the job's OIDC token against the trusted publisher you
# register at npmjs.com (repo + workflow file + optional environment).
#
# Trigger by tag:   git tag v0.1.0 && git push origin v0.1.0
# Or run manually:   Actions -> Release -> Run workflow
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run only (no upload)"
        type: boolean
        default: false

permissions:
  contents: read
  # The one permission that makes OIDC publishing possible.
  id-token: write

# Two publishes at once could race on the registry.
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  # The glm-5.3 lesson: a capability default that assumes too much breaks every turn,
  # so the gating logic is checked before anything reaches the registry. It runs with no
  # install step on purpose: test/caps.test.mjs imports src/capabilities.ts, which imports
  # nothing, so CI cannot fail on a missing pi package and cannot drift from a pi release.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refuse a tracked node_modules
        # A node_modules SYMLINK is not matched by the `node_modules/` gitignore pattern
        # (git stores symlinks as files, mode 120000). That once shipped a symlink holding
        # an absolute path from a maintainer's laptop into the public repo.
        run: |
          if [ -n "$(git ls-files node_modules)" ]; then
            echo "::error::node_modules is committed (git ls-files node_modules is non-empty). Untrack it."
            exit 1
          fi
      - name: Parse guard + capability gating tests
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Hardening: create an environment named `npm` in repo Settings ->
    # Environments, uncomment below, and set the same name as the
    # Environment field in npm's trusted-publisher form. Leave unset if
    # you did not configure the environment.
    # environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # Deliberately no `token:` — with trusted publishing the registry
          # identity comes from the OIDC assertion, not a stored credential.

      - name: Check that the tag matches package.json version
        if: github.event_name == 'push'
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "publishing pi-qtools@$pkg"

      - name: Inspect the exact tarball that would ship
        run: npm pack --dry-run

      - name: Exchange OIDC token for npm publish token
        # Do the exchange explicitly and wire the returned npm token into
        # NODE_AUTH_TOKEN so publish never falls back to an unauthenticated
        # request (which npm reports as a misleading 404).
        run: |
          pkg_name="$(node -p "require('./package.json').name")"
          pkg_path="$(python3 - "$pkg_name" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe=''))
          PY
          )"

          curl -sS -o idtoken.json \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org"
          idtok=$(python3 - <<'PY'
          import json
          print(json.load(open("idtoken.json"))["value"])
          PY
          )
          echo "id_token acquired (${#idtok} chars)"
          echo "--- decoded OIDC claims (what npm matches) ---"
          python3 - "$idtok" <<'PY'
          import base64,json,sys
          p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          keys=["iss","aud","repository","repository_owner",
                "repository_id","job_workflow_ref","ref",
                "environment","actor"]
          for k in keys:
              print(f"  {k}: {c.get(k)}")
          PY
          echo "--- exchange response ---"
          exch="https://registry.npmjs.org"
          exch="$exch/-/npm/v1/oidc/token/exchange/package/$pkg_path"
          code="$(curl -sS -o exch.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $idtok" \
            "$exch")"
          echo "HTTP $code"
          # Success means "the body contains a token", exactly like
          # npm's own client checks. Never print the body on success:
          # that body IS the publish token and this log is public.
          npm_token="$(python3 - <<'PY'
          import json
          print(json.load(open("exch.json")).get("token",""))
          PY
          )"
          if [ -z "$npm_token" ]; then
            echo "::error::npm OIDC exchange HTTP $code, no token"
            echo "--- body (safe: contains no token) ---"
            head -c 800 exch.json; echo
            exit 1
          fi
          echo "::add-mask::$npm_token"
          echo "exchange OK (HTTP $code); token masked"
          echo "NODE_AUTH_TOKEN=$npm_token" >> "$GITHUB_ENV"

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public

      - name: Dry run only
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run
